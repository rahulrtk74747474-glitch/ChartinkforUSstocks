name: Twelve Data API smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/twelve-data-smoke-test.yml"
      - "backend/providers/**"
      - "test_twelve_data.py"
      - "test_vertex_rsi_live.py"
      - "backend/scan_engine.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Twelve Data connection
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_twelve_data.py

      - name: Run live Vertex and RSI(3) sample
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python test_vertex_rsi_live.py
